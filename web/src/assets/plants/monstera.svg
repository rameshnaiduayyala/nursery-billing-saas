<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E2EAE3"/>
      <stop offset="100%" stop-color="#F5F7F1"/>
    </radialGradient>
    <linearGradient id="pot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C6A76A"/>
      <stop offset="100%" stop-color="#8E6F33"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#176B45"/>
      <stop offset="100%" stop-color="#0E2D20"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="32" fill="url(#bg)"/>
  <ellipse cx="200" cy="350" rx="80" ry="15" fill="#123D2B" opacity="0.12"/>

  <!-- Clay Pot -->
  <path d="M145 255 L160 340 H240 L255 255 Z" fill="url(#pot)"/>
  <rect x="138" y="244" width="124" height="15" rx="5" fill="#A8C9A5"/>

  <!-- Stem & Monstera Broad Leaves with Fenestrations -->
  <!-- Center Main Leaf -->
  <g transform="translate(200,150) rotate(-10)">
    <path d="M0 0 C-60 -50 -50 -130 0 -130 C50 -130 60 -50 0 0 Z" fill="url(#leaf)"/>
    <!-- Fenestration Holes -->
    <ellipse cx="-20" cy="-70" rx="5" ry="14" fill="#F5F7F1" transform="rotate(-30 -20 -70)"/>
    <ellipse cx="20" cy="-60" rx="5" ry="14" fill="#F5F7F1" transform="rotate(30 20 -60)"/>
    <ellipse cx="-15" cy="-35" rx="4" ry="10" fill="#F5F7F1" transform="rotate(-40 -15 -35)"/>
    <ellipse cx="18" cy="-30" rx="4" ry="10" fill="#F5F7F1" transform="rotate(40 18 -30)"/>
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#A8C9A5" stroke-width="2"/>
  </g>

  <!-- Left Leaf -->
  <g transform="translate(150,190) rotate(-45)">
    <path d="M0 0 C-45 -35 -40 -95 0 -95 C40 -95 45 -35 0 0 Z" fill="url(#leaf)"/>
    <ellipse cx="-15" cy="-50" rx="4" ry="10" fill="#F5F7F1" transform="rotate(-30 -15 -50)"/>
    <ellipse cx="15" cy="-45" rx="4" ry="10" fill="#F5F7F1" transform="rotate(30 15 -45)"/>
  </g>

  <!-- Right Leaf -->
  <g transform="translate(245,185) rotate(40)">
    <path d="M0 0 C-45 -35 -40 -95 0 -95 C40 -95 45 -35 0 0 Z" fill="url(#leaf)"/>
    <ellipse cx="-15" cy="-50" rx="4" ry="10" fill="#F5F7F1" transform="rotate(-30 -15 -50)"/>
    <ellipse cx="15" cy="-45" rx="4" ry="10" fill="#F5F7F1" transform="rotate(30 15 -45)"/>
  </g>

  <!-- Stems -->
  <path d="M200 250 Q195 200 200 150" stroke="#123D2B" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M200 250 Q180 220 150 190" stroke="#123D2B" stroke-width="4" stroke-linecap="round"/>
  <path d="M200 250 Q220 220 245 185" stroke="#123D2B" stroke-width="4" stroke-linecap="round"/>

  <!-- Plant Label Badge -->
  <g transform="translate(100, 310)">
    <rect width="200" height="32" rx="16" fill="#123D2B" opacity="0.95"/>
    <text x="100" y="21" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">MONSTERA DELICIOSA</text>
  </g>
</svg>
